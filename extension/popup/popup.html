<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书餐馆图片下载工具</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <div>
                    <h1>
                        <i class="icon-download"></i>
                        小红书餐馆图片下载工具
                    </h1>
                    <p class="subtitle">批量下载餐馆相关图片，支持智能水印去除</p>
                </div>
                <button class="btn-help" id="helpBtn" title="帮助">
                    <i class="icon-help"></i>
                    帮助
                </button>
            </div>
        </header>

        <!-- 快速设置板块 -->
        <section class="section config-section" id="configSection">
            <div class="section-header">
                <h2>
                    <i class="icon-cog"></i>
                    快速设置
                </h2>
                <button class="section-toggle" id="configToggle" aria-label="展开/收起设置">
                    <i class="icon-chevron-down"></i>
                </button>
            </div>
            <div class="section-content" id="configContent" style="display: none;">
                <div class="form-group">
                    <label for="maxImages">每个餐馆下载的图片数</label>
                    <input type="number" id="maxImages" class="form-control" min="1" max="100" value="6">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="removeWatermark" checked>
                        <span>智能去除水印</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 高级设置板块 -->
        <section class="section advanced-section" id="advancedSection">
            <div class="section-header">
                <h2>
                    <i class="icon-settings"></i>
                    高级设置
                </h2>
                <button class="section-toggle" id="advancedToggle" aria-label="展开/收起高级设置">
                    <i class="icon-chevron-down"></i>
                </button>
            </div>
            <div class="section-content" id="advancedContent" style="display: none;">
                <!-- AI服务配置 -->
                <div class="form-group">
                    <label class="form-section-label">
                        <i class="icon-ai"></i>
                        AI服务配置
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="aiEnabled">
                        <span>启用AI智能分析功能</span>
                    </label>
                </div>
                <div class="form-group">
                    <label for="aiApiKey">API密钥</label>
                    <input type="password" id="aiApiKey" class="form-control" placeholder="请输入AI服务API密钥">
                    <small class="form-text">用于调用AI服务进行图片分析</small>
                </div>
                <div class="form-group">
                    <label for="aiApiUrl">API地址</label>
                    <input type="text" id="aiApiUrl" class="form-control" placeholder="https://open.bigmodel.cn/api/paas/v4/chat/completions" value="https://open.bigmodel.cn/api/paas/v4/chat/completions">
                    <small class="form-text">AI服务的API地址</small>
                </div>
                <div class="form-group">
                    <label for="aiModel">模型名称</label>
                    <input type="text" id="aiModel" class="form-control" placeholder="glm-4-flash" value="glm-4-flash">
                    <small class="form-text">使用的AI模型名称</small>
                </div>

                <!-- 下载选项 -->
                <div class="form-group">
                    <label class="form-section-label">
                        <i class="icon-download"></i>
                        下载选项
                    </label>
                </div>
                <div class="form-group">
                    <label for="defaultDownloadPath">默认下载路径</label>
                    <input type="text" id="defaultDownloadPath" class="form-control" placeholder="downloads" value="downloads">
                    <small class="form-text">图片保存的默认路径（相对于Chrome下载目录）</small>
                </div>
                <div class="form-group">
                    <label for="downloadDelay">下载延迟（毫秒）</label>
                    <input type="number" id="downloadDelay" class="form-control" min="0" max="10000" value="1000">
                    <small class="form-text">每次下载之间的延迟时间，避免请求过快</small>
                </div>

                <!-- 图片处理选项 -->
                <div class="form-group">
                    <label class="form-section-label">
                        <i class="icon-image"></i>
                        图片处理选项
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoRemoveWatermark" checked>
                        <span>自动去除水印</span>
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoProcessImage" checked>
                        <span>自动处理图片（裁剪、优化）</span>
                    </label>
                </div>

                <!-- 其他选项 -->
                <div class="form-group">
                    <label class="form-section-label">
                        <i class="icon-other"></i>
                        其他选项
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="showNotifications">
                        <span>显示下载通知</span>
                    </label>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoOpenFolder">
                        <span>下载完成后自动打开文件夹</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 餐馆配置板块 -->
        <section class="section restaurant-section">
            <div class="section-header">
                <h2>
                    <i class="icon-list"></i>
                    餐馆配置
                </h2>
                <div class="button-group-inline">
                    <button class="btn btn-primary btn-sm" id="startDownloadBtn" disabled>
                        <i class="icon-play"></i>
                        开始下载
                    </button>
                    <button class="btn btn-secondary btn-sm" id="addRestaurantBtn">
                        <i class="icon-plus"></i>
                        添加
                    </button>
                    <button class="btn btn-secondary btn-sm" id="importBtn">
                        <i class="icon-upload"></i>
                        导入
                    </button>
                </div>
            </div>
            <div id="restaurantList" class="restaurant-list">
                <p class="empty-message">暂无餐馆配置，请添加或导入</p>
            </div>
        </section>

        <!-- 下载进度板块 -->
        <section class="section progress-section" id="progressSection" style="display: none;">
            <h2>
                <i class="icon-progress"></i>
                下载进度
            </h2>
            <div class="progress-bar-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            <div id="currentTask" class="current-task"></div>
            <div id="progressDetails" class="progress-details"></div>
        </section>

        <!-- 日志显示板块 -->
        <section class="section log-section" id="logSection" style="display: none;">
            <div class="section-header">
                <h2>
                    <i class="icon-log"></i>
                    日志
                </h2>
                <div class="log-controls">
                    <select id="logLevel" class="form-control form-control-sm">
                        <option value="all">全部</option>
                        <option value="info">信息</option>
                        <option value="success">成功</option>
                        <option value="warning">警告</option>
                        <option value="error">错误</option>
                    </select>
                    <button class="btn btn-secondary btn-sm" id="clearLogBtn">
                        <i class="icon-clear"></i>
                        清空
                    </button>
                </div>
            </div>
            <div id="logContainer" class="log-container"></div>
        </section>

    </div>

    <!-- 添加餐馆对话框 -->
    <div id="addRestaurantModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加餐馆</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="restaurantName">餐馆名称 *</label>
                    <input type="text" id="restaurantName" class="form-control" placeholder="请输入餐馆名称" required>
                </div>
                <div class="form-group">
                    <label for="restaurantLocation">地点（可选）</label>
                    <input type="text" id="restaurantLocation" class="form-control" placeholder="请输入地点信息">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelAddBtn">取消</button>
                <button class="btn btn-primary" id="confirmAddBtn">确定</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
